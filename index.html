<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="stylle.css">
</head>
<body>
    <header id="cabecalho">
        <h1 class="titulo">
            Meu primeiro formulario
        </h1>
    </header>
    <main id="principal">
        <form action="" id="formulario">
        <h2 class="titulo">Login</h2>
        <div class="caixacampo">
            <label for="emailcampo" class="emailcampo">
                Email
            </label>
            <input type="text" class="campoformulario" id="emailCampo" nome="emailNome" placeholder="Digite seu email...">
        </div>

        <div class="caixacampo">
            <label for="senhacampo" class="rotuloCampo">
                Senha
            </label>
            <input type="password" class="campoformulario" id="senhacampo" nome="senhanome" placeholder="Digite sua senha...">
        </div>
        <button id="botaoEnviar">Enviar</button>
</form>
    </main>
    <footer id="rodape">
        <p>&copy; todos os direitos reservados a henrique</p>
    </footer>
    
</body>
</html>
